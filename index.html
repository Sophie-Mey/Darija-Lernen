    /**
     * ============================================================================
     * 2. STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
     * ============================================================================
     */
    const STORAGE_KEY = 'darija_bil_3arabiya_state_v1';

    const defaultState = {
      completedLessons: [],     // e.g. ['k1-l1', 'k1-l2']
      completedQuizzes: [],     // e.g. ['kapitel-1']
      masteredPhrases: [],      // e.g. ['p1_1', 'p1_2']
      streak: 0,
      lastStudyDate: null,      // 'YYYY-MM-DD'
      dailyCompletedDate: null, // 'YYYY-MM-DD'
      xp: 0,
      showTransliteration: true,
      customChapters: []        // Appended chapters imported by user
    };

    let appState = loadState();
    let activeSession = null; // Holds current lesson / daily / quiz session
    let arabicVoices = [];
    let hasArabicVoice = false;
    let activeRecognition = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...defaultState };
        const parsed = JSON.parse(raw);
        return { ...defaultState, ...parsed };
      } catch (e) {
        console.warn('Fehler beim Laden des Speicherstands:', e);
        return { ...defaultState };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Fehler beim Speichern:', e);
      }
      updateHeaderStats();
    }

    function getAllChapters() {
      return [...DEFAULT_CURRICULUM, ...(appState.customChapters || [])];
    }

    function getTodayISO() {
      const now = new Date();
      return now.toISOString().split('T')[0];
    }

    function getYesterdayISO() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    }

    function recordDailyActivity(earnedXp = 20) {
      const today = getTodayISO();
      const yesterday = getYesterdayISO();

      if (appState.lastStudyDate !== today) {
        if (appState.lastStudyDate === yesterday) {
          appState.streak = (appState.streak || 0) + 1;
        } else {
          appState.streak = 1;
        }
        appState.lastStudyDate = today;
      }
      appState.xp = (appState.xp || 0) + earnedXp;
      saveState();
    }

    /**
     * ============================================================================
     * 3. AUDIO (TEXT-TO-SPEECH) & SPRACHEINGABE (SPEECH RECOGNITION)
     * ============================================================================
     */
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const load = () => {
        const voices = window.speechSynthesis.getVoices();
        arabicVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
        hasArabicVoice = arabicVoices.length > 0;
      };
      load();
      window.speechSynthesis.onvoiceschanged = load;
    }

    function speakDarija(text, rate = 0.92) {
      if (!('speechSynthesis' in window)) {
        showToast('Dein Browser unterstützt leider keine Sprachausgabe.', 'info');
        return;
      }
      window.speechSynthesis.cancel();

      const cleanText = text.replace(/\//g, ' ، ');
      const utterance = new SpeechSynthesisUtterance(cleanText);

      // Prefer Moroccan Arabic (ar-MA), fallback to any Arabic voice
      const maVoice = arabicVoices.find(v => v.lang.toLowerCase() === 'ar-ma');
      const fallbackAr = arabicVoices[0];

      if (maVoice) {
        utterance.voice = maVoice;
        utterance.lang = 'ar-MA';
      } else if (fallbackAr) {
        utterance.voice = fallbackAr;
        utterance.lang = fallbackAr.lang;
      } else {
        utterance.lang = 'ar-MA';
      }

      utterance.rate = rate;
      utterance.pitch = 1.0;

      utterance.onerror = () => {
        if (!hasArabicVoice) {
          showToast('Hinweis: Auf diesem Gerät ist keine arabische Stimme installiert. Nutze gerne Schrift & Lautschrift!', 'info');
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    /**
     * Normalizes Arabic script for forgiving pronunciation matching:
     * removes tashkeel/diacritics, punctuation, unifies alif & ya forms.
     */
    function normalizeArabic(str) {
      if (!str) return '';
      return str
        .replace(/[\u064B-\u065F\u0670]/g, '') // Remove Arabic diacritics
        .replace(/[؟?!.,،؛:"'()\-]/g, ' ')     // Remove punctuation
        .replace(/[أإآ]/g, 'ا')                // Normalize Alif
        .replace(/ى/g, 'ي')                    // Normalize Alif Maqsura
        .replace(/ة/g, 'ه')                    // Normalize Ta Marbuta gently
        .replace(/\s+/g, ' ')
        .trim();
    }

    function isSpeechRecognitionSupported() {
      return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
    }

    /**
     * ============================================================================
     * 4. UI HELPERS: TOASTS, CLIPBOARD, TRANSLITERATION TOGGLE
     * ============================================================================
     */
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'success'
        ? 'bg-zellige-700 text-white border-zellige-500'
        : type === 'warning'
        ? 'bg-terracotta-600 text-white border-terracotta-500'
        : 'bg-slate-800 text-white border-slate-700';

      toast.className = `${bg} border px-4 py-3 rounded-2xl shadow-lg text-sm font-medium pointer-events-auto animate-step flex items-center gap-2`;
      toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'warning' ? '⚠️' : '💡'}</span><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    function copyTextToClipboard(text, successMsg = 'In die Zwischenablage kopiert!') {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'success');
      } catch (err) {
        showToast('Kopieren fehlgeschlagen. Bitte markiere den Text manuell.', 'warning');
      }
      document.body.removeChild(textarea);
    }

    function toggleTransliteration() {
      appState.showTransliteration = !appState.showTransliteration;
      saveState();
      updateTranslitButton();
      // Re-render current view seamlessly
      if (activeSession) {
        renderSessionStep();
      } else {
        renderDashboard();
      }
      showToast(
        appState.showTransliteration
          ? 'Lautschrift eingeblendet'
          : 'Lautschrift ausgeblendet – jetzt trainierst du reine arabische Schrift!',
        'info'
      );
    }

    function updateTranslitButton() {
      const btn = document.getElementById('toggle-translit-btn');
      const indicator = document.getElementById('translit-indicator');
      const label = document.getElementById('translit-label');
      if (appState.showTransliteration) {
        btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer bg-saffron-50 text-saffron-600 border-saffron-400/50';
        indicator.className = 'w-2 h-2 rounded-full bg-saffron-500';
        label.textContent = 'AN';
      } else {
        btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold border transition-all cursor-pointer bg-slate-100 text-slate-600 border-slate-300';
        indicator.className = 'w-2 h-2 rounded-full bg-slate-400';
        label.textContent = 'AUS';
      }
    }

    function updateHeaderStats() {
      // Check if streak expired (more than 1 day gap)
      const today = getTodayISO();
      const yesterday = getYesterdayISO();
      let displayStreak = appState.streak || 0;
      if (appState.lastStudyDate && appState.lastStudyDate !== today && appState.lastStudyDate !== yesterday) {
        displayStreak = 0;
      }

      document.getElementById('stat-streak').textContent = displayStreak;
      document.getElementById('stat-phrases').textContent = (appState.masteredPhrases || []).length;
      document.getElementById('stat-xp').textContent = appState.xp || 0;
    }

    /**
     * Helper to render transliteration respecting global toggle + optional "Spicken" button
     */
    function renderTranslitBlock(trText, uniqueId, extraClasses = 'text-sm text-slate-600') {
      if (!trText) return '';
      if (appState.showTransliteration) {
        return `<p class="${extraClasses} font-medium">${trText}</p>`;
      }
      return `
        <div class="inline-flex items-center gap-2">
          <span id="peek-text-${uniqueId}" class="hidden ${extraClasses} font-medium bg-saffron-50 text-saffron-600 px-2.5 py-0.5 rounded-lg border border-saffron-200">${trText}</span>
          <button type="button" onclick="togglePeek('${uniqueId}', this)"
            class="text-xs text-slate-500 hover:text-zellige-700 bg-sand-100 hover:bg-sand-200 px-2.5 py-1 rounded-lg transition-colors cursor-pointer">
            👁️ Lautschrift spicken
          </button>

      const el = document.getElementById(`peek-text-${uniqueId}`);
      if (!el) return;
      const isHidden = el.classList.contains('hidden');
      if (isHidden) {
        el.classList.remove('hidden');
        btn.textContent = '🙈 Ausblenden';
      } else {
        el.classList.add('hidden');
        btn.textContent = '👁️ Lautschrift spicken';

      if (activeRecognition) {

    /**
     * ============================================================================
     * 6. SESSION BUILDERS (LEKTION, TÄGLICHE LERNEINHEIT, KAPITEL-ABSCHLUSS-TEST)
     * ============================================================================
     */
    function startLesson(chapterId, lessonId) {
      const chapter = getAllChapters().find(c => c.id === chapterId);
      if (!chapter) return;
      const lesson = chapter.lessons.find(l => l.id === lessonId);
      if (!lesson) return;

      // Interleave intro cards for phrases with interactive exercises
      const steps = [];
      lesson.phrases.forEach((phrase, idx) => {
        steps.push({
          type: 'intro',
          phrase
        });
        // Add an exercise after every 1-2 intro cards for engaging pacing
        if (lesson.exercises[idx]) {
          steps.push(lesson.exercises[idx]);
        }
      });

      // Append any remaining exercises
      if (lesson.exercises.length > lesson.phrases.length) {
        for (let i = lesson.phrases.length; i < lesson.exercises.length; i++) {
          steps.push(lesson.exercises[i]);
        }
      }

      activeSession = {
        mode: 'lesson',
        title: `Kapitel ${chapter.number}: ${lesson.title}`,
        chapterId: chapter.id,
        lessonId: lesson.id,
        phraseIds: lesson.phrases.map(p => p.id),
        steps,
        currentIndex: 0,
        correctCount: 0,
        quizTotal: steps.filter(s => s.type !== 'intro').length,
        stepAnswered: false,
        builderSelection: []
      };

      renderSessionStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startChapterQuiz(chapterId) {
      const chapter = getAllChapters().find(c => c.id === chapterId);
      if (!chapter || !chapter.chapterQuiz) return;

      const allPhraseIds = chapter.lessons.flatMap(l => l.phrases.map(p => p.id));

      activeSession = {
        mode: 'quiz',
        title: `Abschluss-Test: Kapitel ${chapter.number} – ${chapter.title}`,
        chapterId: chapter.id,
        phraseIds: allPhraseIds,
        steps: chapter.chapterQuiz,
        currentIndex: 0,
        correctCount: 0,
        quizTotal: chapter.chapterQuiz.length,
        stepAnswered: false,
        builderSelection: []
      };

      renderSessionStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startDailyUnit() {
      const chapters = getAllChapters();
      const steps = [];
      const learnedPhraseIds = [];

      // 1. Find next uncompleted lesson
      let nextLesson = null;
      for (const ch of chapters) {
        for (const l of ch.lessons) {
          if (!appState.completedLessons.includes(l.id)) {
            nextLesson = l;
            break;
          }
        }
        if (nextLesson) break;
      }

      if (nextLesson) {
        // Take first 2 new phrases + 2 exercises from next lesson
        nextLesson.phrases.slice(0, 2).forEach(p => {
          steps.push({ type: 'intro', phrase: p, badge: 'Neu für dich' });
          learnedPhraseIds.push(p.id);
        });
        nextLesson.exercises.slice(0, 2).forEach(ex => steps.push(ex));
      }

      // 2. Gather review exercises from completed lessons (or chapter 1 if brand new)
      const reviewPool = [];
      chapters.forEach(ch => {
        ch.lessons.forEach(l => {
          if (appState.completedLessons.includes(l.id) || !nextLesson) {
            l.exercises.forEach(ex => reviewPool.push(ex));
          }
        });
      });

      // Fallback if user has 0 completed lessons: add 2 more exercises from nextLesson
      if (reviewPool.length === 0 && nextLesson) {
        nextLesson.exercises.slice(2, 4).forEach(ex => steps.push(ex));
      } else {
        // Shuffle reviewPool and take up to 4 items
        const shuffled = [...reviewPool].sort(() => Math.random() - 0.5);
        shuffled.slice(0, 4).forEach(ex => steps.push(ex));
      }

      activeSession = {
        mode: 'daily',
        title: 'Tägliche Lerneinheit',
        phraseIds: learnedPhraseIds,
        steps,
        currentIndex: 0,
        correctCount: 0,
        quizTotal: steps.filter(s => s.type !== 'intro').length,
        stepAnswered: false,
        builderSelection: []
      };

      renderSessionStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /**
     * ============================================================================
     * 7. INTERACTIVE EXERCISE ENGINE RENDERER
     * ============================================================================
     */
    function renderSessionStep() {
      const main = document.getElementById('app-main');
      if (!activeSession) return renderDashboard();

      // Check if session finished
      if (activeSession.currentIndex >= activeSession.steps.length) {
        renderSessionComplete();
        return;
      }

      const step = activeSession.steps[activeSession.currentIndex];
      const total = activeSession.steps.length;
      const pct = Math.round(((activeSession.currentIndex) / total) * 100);

      let stepHTML = '';
      if (step.type === 'intro') {
        stepHTML = renderIntroCard(step);
      } else if (step.type === 'choice') {
        stepHTML = renderChoiceStep(step);
      } else if (step.type === 'builder') {
        stepHTML = renderBuilderStep(step);
      } else if (step.type === 'cloze') {
        stepHTML = renderClozeStep(step);
      } else if (step.type === 'listening') {
        stepHTML = renderListeningStep(step);
      } else if (step.type === 'speaking') {
        stepHTML = renderSpeakingStep(step);
      }

      main.innerHTML = `
        <div class="max-w-2xl mx-auto">
          <!-- Top Session Bar -->
          <div class="flex items-center gap-3 mb-6">
            <button onclick="goHome()" class="w-10 h-10 rounded-xl bg-white border border-sand-200 hover:bg-sand-100 flex items-center justify-center text-slate-600 font-bold cursor-pointer shrink-0" title="Zurück zur Übersicht">
              ✕
            </button>
            <div class="flex-1">
              <div class="flex items-center justify-between text-xs font-semibold text-slate-500 mb-1.5">
                <span class="truncate pr-2">${activeSession.title}</span>
                <span class="shrink-0">Schritt ${activeSession.currentIndex + 1} von ${total}</span>
              </div>
              <div class="w-full h-2.5 bg-sand-200 rounded-full overflow-hidden">
                <div class="h-full bg-zellige-600 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
              </div>
            </div>
          </div>

          <!-- Step Card -->
          <div class="bg-white rounded-3xl border border-sand-200 shadow-sm p-6 sm:p-8 animate-step">
            ${stepHTML}
          </div>
        </div>
      `;

      // Auto-play audio for listening exercises gently
      if (step.type === 'listening' && !activeSession.stepAnswered) {
        setTimeout(() => speakDarija(step.audioAr, 0.9), 300);
      }
    }

    // --- 7.1 LERNKARTE (INTRO) ---
    function renderIntroCard(step) {
      const p = step.phrase;
      return `
        <div class="text-center">
          <span class="inline-block text-xs font-bold uppercase tracking-wider bg-zellige-50 text-zellige-700 border border-zellige-200 px-3 py-1 rounded-full mb-5">
            ${step.badge || 'Neuer Ausdruck'}
          </span>

          <!-- Large Arabic Script -->
          <div class="bg-sand-50 border border-sand-200 rounded-2xl p-6 mb-5">

            ${renderTranslitBlock(p.tr, `intro-${p.id}`, 'text-base sm:text-lg text-terracotta-600')}

          <!-- German Translation -->
          <p class="font-display text-xl sm:text-2xl font-bold text-slate-800 mb-5">

            <button type="button" onclick="speakDarija('${escapeQuotes(p.ar)}', 0.92)"
              class="px-4 py-2.5 rounded-xl bg-zellige-600 hover:bg-zellige-700 text-white text-sm font-semibold flex items-center gap-2 shadow-xs cursor-pointer">
              <span>🔊</span><span>Anhören</span>
            </button>
            <button type="button" onclick="speakDarija('${escapeQuotes(p.ar)}', 0.62)"

              <span>🐢</span><span>Langsam</span>

          </div>

          <!-- Cultural / Grammar Note -->
          ${p.note ? `
            <div class="text-left bg-saffron-50 border border-saffron-200 rounded-2xl p-4 mb-6 flex items-start gap-3">
              <span class="text-lg shrink-0">💡</span>

            </div>
          ` : ''}

          <button type="button" onclick="advanceStep(true)"

            Verstanden, weiter →
          </button>
        </div>
      `;
    }

    // --- 7.2 MINI-DIALOG / MULTIPLE CHOICE ---
    function renderChoiceStep(step) {
      return `
        <div>
          <span class="inline-block text-xs font-bold uppercase tracking-wider bg-terracotta-50 text-terracotta-700 px-3 py-1 rounded-full mb-4">
            💬 Situation &amp; Auswahl
          </span>
          <h2 class="font-display text-lg sm:text-xl font-bold text-slate-800 leading-snug mb-5">
            ${step.prompt}
          </h2>

          <div class="space-y-3" id="choice-options">
            ${step.options.map((opt, idx) => `
              <button type="button" onclick="handleChoiceSelect(${idx})"
                id="choice-btn-${idx}"
                class="w-full text-left p-4 rounded-2xl border-2 border-sand-200 hover:border-zellige-500 bg-sand-50/50 hover:bg-white transition-all flex items-center justify-between gap-4 cursor-pointer">
                <div>
                  <p class="arabic-text text-xl sm:text-2xl font-bold text-slate-900">${opt.ar}</p>
                  ${appState.showTransliteration && opt.tr ? `<p class="text-sm text-slate-600 font-medium mt-0.5">${opt.tr}</p>` : ''}
                </div>
                <span onclick="event.stopPropagation(); speakDarija('${escapeQuotes(opt.ar)}')"
                  class="w-9 h-9 rounded-xl bg-white border border-sand-200 hover:bg-zellige-50 flex items-center justify-center text-sm shrink-0" title="Anhören">
                  🔊
                </span>
              </button>
            `).join('')}
          </div>

          <div id="step-feedback" class="hidden mt-5"></div>
        </div>
      `;
    }

    function handleChoiceSelect(selectedIdx) {
      if (activeSession.stepAnswered) return;
      activeSession.stepAnswered = true;

      const step = activeSession.steps[activeSession.currentIndex];
      const chosen = step.options[selectedIdx];
      const isCorrect = Boolean(chosen.correct);

      if (isCorrect) activeSession.correctCount++;
      speakDarija(chosen.ar);

      step.options.forEach((opt, idx) => {
        const btn = document.getElementById(`choice-btn-${idx}`);
        btn.disabled = true;
        btn.classList.remove('hover:border-zellige-500', 'hover:bg-white');
        if (opt.correct) {
          btn.classList.add('border-zellige-600', 'bg-zellige-50');
        } else if (idx === selectedIdx && !opt.correct) {
          btn.classList.add('border-terracotta-600', 'bg-terracotta-50');
        } else {
          btn.classList.add('opacity-55');
        }
      });

      showStepFeedback(isCorrect, step.explanation || (isCorrect ? 'Richtig!' : 'Nicht ganz – schau dir die markierte Lösung an.'));
    }

    // --- 7.3 SATZBAU-PUZZLE (WORD ORDER BUILDER) ---
    function renderBuilderStep(step) {
      if (!activeSession.shuffledWords) {
        activeSession.shuffledWords = step.words
          .map((w, i) => ({ ...w, uid: i }))
          .sort(() => Math.random() - 0.5);
      }

      const selectedUids = new Set(activeSession.builderSelection.map(w => w.uid));

      return `
        <div>
          <span class="inline-block text-xs font-bold uppercase tracking-wider bg-zellige-50 text-zellige-700 px-3 py-1 rounded-full mb-4">
            🧩 Satzbau-Puzzle
          </span>
          <h2 class="font-display text-lg sm:text-xl font-bold text-slate-800 mb-2">
            ${step.prompt}
          </h2>
          <p class="text-xs text-slate-500 mb-5">Tippe die Darija-Bausteine in der richtigen Reihenfolge an (von rechts nach links).</p>

          <!-- Target Drop Area (RTL) -->
          <div dir="rtl" class="min-h-20 p-4 rounded-2xl bg-sand-50 border-2 border-dashed border-sand-300 flex flex-wrap items-center gap-2.5 mb-5">
            ${
              activeSession.builderSelection.length === 0
                ? `<span dir="ltr" class="text-xs text-slate-400 mx-auto">Deine ausgewählten Wörter erscheinen hier...</span>`

                    <button type="button" onclick="removeBuilderWord(${pos})" ${activeSession.stepAnswered ? 'disabled' : ''}
                      class="px-3.5 py-2 rounded-xl bg-zellige-600 text-white shadow-xs flex flex-col items-center cursor-pointer hover:bg-zellige-700 transition-colors">
                      <span class="arabic-text text-lg font-bold leading-tight">${w.ar}</span>
                      ${appState.showTransliteration ? `<span dir="ltr" class="text-[11px] text-zellige-100">${w.tr}</span>` : ''}
                    </button>
                  `).join('')
            }
          </div>

          <!-- Word Bank -->
          <div dir="rtl" class="flex flex-wrap justify-center gap-2.5 mb-6">
            ${activeSession.shuffledWords.map(w => {
              const isUsed = selectedUids.has(w.uid);
              return `
                <button type="button" onclick="addBuilderWord(${w.uid})" ${isUsed || activeSession.stepAnswered ? 'disabled' : ''}
                  class="px-4 py-2.5 rounded-xl border-2 transition-all flex flex-col items-center cursor-pointer
                  ${isUsed
                    ? 'bg-sand-100 border-sand-200 opacity-35 cursor-default'
                    : 'bg-white border-sand-300 hover:border-zellige-600 shadow-2xs'}">
                  <span class="arabic-text text-lg font-bold text-slate-900 leading-tight">${w.ar}</span>
                  ${appState.showTransliteration ? `<span dir="ltr" class="text-xs text-slate-500">${w.tr}</span>` : ''}
                </button>
              `;
            }).join('')}
          </div>

          ${!activeSession.stepAnswered ? `
            <button type="button" onclick="checkBuilderAnswer()"
              ${activeSession.builderSelection.length === 0 ? 'disabled' : ''}
              class="w-full py-3.5 rounded-2xl font-bold text-base transition-colors cursor-pointer
              ${activeSession.builderSelection.length === 0
                ? 'bg-sand-200 text-slate-400 cursor-not-allowed'
                : 'bg-zellige-600 hover:bg-zellige-700 text-white shadow-sm'}">
              Antwort prüfen
            </button>
          ` : ''}

          <div id="step-feedback" class="hidden mt-5"></div>
        </div>
      `;
    }

    function addBuilderWord(uid) {
      if (activeSession.stepAnswered) return;
      const wordObj = activeSession.shuffledWords.find(w => w.uid === uid);
      if (wordObj) {
        activeSession.builderSelection.push(wordObj);
        renderSessionStep();
      }
    }

    function removeBuilderWord(pos) {
      if (activeSession.stepAnswered) return;
      activeSession.builderSelection.splice(pos, 1);
      renderSessionStep();
    }

    function checkBuilderAnswer() {
      if (activeSession.stepAnswered) return;
      activeSession.stepAnswered = true;

      const step = activeSession.steps[activeSession.currentIndex];
      const builtAr = activeSession.builderSelection.map(w => w.ar).join(' ');
      const isCorrect = normalizeArabic(builtAr) === normalizeArabic(step.targetAr);

      if (isCorrect) activeSession.correctCount++;
      speakDarija(step.targetAr);

      // Re-render to lock chips, then show feedback
      renderSessionStep();
      const solutionHtml = `
        <div class="mt-2 pt-2 border-t border-black/10">
          <span class="text-xs font-semibold">Lösung:</span>
          <span class="arabic-text text-lg font-bold ml-2">${step.targetAr}</span>
          ${appState.showTransliteration ? `<span class="text-xs ml-2">(${step.targetTr})</span>` : ''}
        </div>
      `;
      showStepFeedback(isCorrect, (isCorrect ? 'Perfekt zusammengesetzt!' : 'Nicht ganz die richtige Reihenfolge.') + solutionHtml);
    }

    // --- 7.4 LÜCKENTEXT (CLOZE) ---
    function renderClozeStep(step) {
      return `
        <div>
          <span class="inline-block text-xs font-bold uppercase tracking-wider bg-saffron-50 text-saffron-600 border border-saffron-200 px-3 py-1 rounded-full mb-4">
            ✍️ Lückentext &amp; Grammatik
          </span>
          <h2 class="font-display text-lg sm:text-xl font-bold text-slate-800 mb-5">
            ${step.prompt}
          </h2>

          <div dir="rtl" class="bg-sand-50 border border-sand-200 rounded-2xl p-5 text-center mb-6">
            <p class="arabic-text text-2xl sm:text-3xl font-bold text-slate-900">
              ${step.sentenceBefore}
              <span id="cloze-slot" class="inline-block min-w-24 px-3 py-0.5 mx-1 border-b-2 border-terracotta-600 text-terracotta-600">___</span>
              ${step.sentenceAfter}
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            ${step.options.map((opt, idx) => `
              <button type="button" onclick="handleClozeSelect(${idx})" id="cloze-btn-${idx}"
                class="p-4 rounded-2xl border-2 border-sand-200 hover:border-zellige-500 bg-white text-center transition-all cursor-pointer">
                <p class="arabic-text text-xl font-bold text-slate-900">${opt.ar}</p>
                ${appState.showTransliteration ? `<p class="text-xs text-slate-500 font-medium mt-1">${opt.tr}</p>` : ''}
              </button>
            `).join('')}
          </div>

          <div id="step-feedback" class="hidden mt-5"></div>
        </div>
      `;
    }

    function handleClozeSelect(selectedIdx) {
      if (activeSession.stepAnswered) return;
      activeSession.stepAnswered = true;

      const step = activeSession.steps[activeSession.currentIndex];
      const chosen = step.options[selectedIdx];
      const isCorrect = Boolean(chosen.correct);

      if (isCorrect) activeSession.correctCount++;

      const slot = document.getElementById('cloze-slot');
      if (slot) slot.textContent = chosen.ar;

      const fullSentence = `${step.sentenceBefore} ${chosen.ar} ${step.sentenceAfter}`;
      speakDarija(fullSentence);

      step.options.forEach((opt, idx) => {
        const btn = document.getElementById(`cloze-btn-${idx}`);
        btn.disabled = true;
        if (opt.correct) {
          btn.classList.add('border-zellige-600', 'bg-zellige-50');
        } else if (idx === selectedIdx && !opt.correct) {
          btn.classList.add('border-terracotta-600', 'bg-terracotta-50');
        } else {
          btn.classList.add('opacity-50');
        }
      });

      showStepFeedback(isCorrect, step.explanation || '');
    }

    // --- 7.5 HÖRVERSTEHEN (LISTENING COMPREHENSION) ---
    function renderListeningStep(step) {
      return `
        <div>
          <span class="inline-block text-xs font-bold uppercase tracking-wider bg-zellige-50 text-zellige-700 px-3 py-1 rounded-full mb-4">
            🎧 Hörverstehen
          </span>
          <h2 class="font-display text-lg sm:text-xl font-bold text-slate-800 mb-5">
            ${step.prompt}
          </h2>

          <div class="bg-sand-50 border border-sand-200 rounded-2xl p-6 flex flex-col items-center justify-center mb-6">
            <div class="flex items-center gap-3">
              <button type="button" onclick="speakDarija('${escapeQuotes(step.audioAr)}', 0.92)"
                class="px-5 py-3 rounded-2xl bg-zellige-600 hover:bg-zellige-700 text-white font-bold text-sm flex items-center gap-2 shadow-sm cursor-pointer">
                <span class="text-lg">🔊</span><span>Abspielen</span>
              </button>
              <button type="button" onclick="speakDarija('${escapeQuotes(step.audioAr)}', 0.60)"
                class="px-4 py-3 rounded-2xl bg-white border border-sand-300 hover:bg-sand-100 text-slate-700 font-semibold text-sm flex items-center gap-2 cursor-pointer">

              </button>
            </div>
            <div id="listening-reveal" class="hidden mt-4 text-center">
              <p class="arabic-text text-xl font-bold text-slate-900">${step.audioAr}</p>
              ${appState.showTransliteration ? `<p class="text-xs text-terracotta-600 font-medium">${step.audioTr}</p>` : ''}
            </div>
          </div>

          <div class="space-y-2.5">
            ${step.options.map((opt, idx) => `
              <button type="button" onclick="handleListeningSelect(${idx})" id="listen-btn-${idx}"
                class="w-full text-left p-4 rounded-2xl border-2 border-sand-200 hover:border-zellige-500 bg-white font-semibold text-sm sm:text-base text-slate-800 transition-all cursor-pointer">
                ${opt.text}
              </button>
            `).join('')}
          </div>

          <div id="step-feedback" class="hidden mt-5"></div>
        </div>
      `;
    }

    function handleListeningSelect(selectedIdx) {
      if (activeSession.stepAnswered) return;
      activeSession.stepAnswered = true;

      const step = activeSession.steps[activeSession.currentIndex];
      const chosen = step.options[selectedIdx];
      const isCorrect = Boolean(chosen.correct);

      if (isCorrect) activeSession.correctCount++;

      const reveal = document.getElementById('listening-reveal');
      if (reveal) reveal.classList.remove('hidden');

      step.options.forEach((opt, idx) => {
        const btn = document.getElementById(`listen-btn-${idx}`);
        btn.disabled = true;
        if (opt.correct) {
          btn.classList.add('border-zellige-600', 'bg-zellige-50', 'text-zellige-800');
        } else if (idx === selectedIdx && !opt.correct) {
          btn.classList.add('border-terracotta-600', 'bg-terracotta-50', 'text-terracotta-800');
        } else {
          btn.classList.add('opacity-50');
        }
      });

      showStepFeedback(isCorrect, isCorrect ? 'Super herausgehört!' : 'Schau dir oben den gesprochenen Satz noch einmal an.');
    }

    // --- 7.6 AUSSPRACHE-CHECK (OPTIONAL SPEECH RECOGNITION) ---
    function renderSpeakingStep(step) {
      const supported = isSpeechRecognitionSupported();
      return `
        <div class="text-center">
          <span class="inline-block text-xs font-bold uppercase tracking-wider bg-terracotta-50 text-terracotta-700 px-3 py-1 rounded-full mb-4">
            🎙️ Aussprache-Check (Optional)
          </span>
          <h2 class="font-display text-lg sm:text-xl font-bold text-slate-800 mb-4">
            ${step.prompt}
          </h2>

          <div class="bg-sand-50 border border-sand-200 rounded-2xl p-5 mb-5">
            <p class="arabic-text text-2xl sm:text-3xl font-bold text-slate-900 mb-2">${step.targetAr}</p>
            ${renderTranslitBlock(step.targetTr, 'speak-target', 'text-base text-terracotta-600')}
            <p class="text-xs text-slate-500 mt-2">„${step.targetDe}“</p>
            <button type="button" onclick="speakDarija('${escapeQuotes(step.targetAr)}', 0.85)"
              class="mt-3 inline-flex items-center gap-1.5 text-xs font-semibold text-zellige-700 bg-white border border-sand-200 px-3 py-1.5 rounded-xl hover:bg-zellige-50 cursor-pointer">
              <span>🔊</span><span>Erst noch einmal anhören</span>
            </button>
          </div>

          ${
            supported
              ? `
                <div class="my-5 flex flex-col items-center">
                  <button type="button" id="mic-btn" onclick="startSpeechCheck()"
                    class="w-18 h-18 rounded-full bg-terracotta-600 hover:bg-terracotta-500 text-white flex items-center justify-center text-3xl shadow-md transition-all cursor-pointer p-5">
                    🎙️
                  </button>
                  <p id="mic-status" class="text-xs font-medium text-slate-500 mt-2.5">Tippe auf das Mikrofon und sprich den Satz</p>
                  <div id="speech-heard-box" class="hidden mt-3 px-4 py-2 rounded-xl bg-slate-100 text-sm">
                    Erkannt: <span id="speech-heard-text" class="arabic-text font-bold text-slate-800"></span>
                  </div>
                </div>
              `
              : `
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-xs text-slate-600 mb-5">
                  ℹ️ Dein aktueller Browser unterstützt keine direkte arabische Spracherkennung über das Mikrofon. Sprich den Satz gerne laut für dich selbst und klicke dann auf Weiter!
                </div>
              `
          }

          <div id="step-feedback" class="hidden mb-4"></div>

          <button type="button" onclick="skipSpeakingStep()"
            class="text-xs sm:text-sm font-semibold text-slate-500 hover:text-slate-800 underline underline-offset-4 py-2 cursor-pointer">
            Überspringen (Gerade nicht sprechen) →
          </button>
        </div>
      `;
    }

    function startSpeechCheck() {
      if (activeSession.stepAnswered) return;
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return;

      const step = activeSession.steps[activeSession.currentIndex];
      const micBtn = document.getElementById('mic-btn');
      const statusEl = document.getElementById('mic-status');

      try {
        activeRecognition = new SpeechRec();
        activeRecognition.lang = 'ar-MA';
        activeRecognition.interimResults = false;
        activeRecognition.maxAlternatives = 3;

        micBtn.classList.add('mic-recording');
        statusEl.textContent = 'Ich höre zu... Sprich jetzt!';

        activeRecognition.onresult = (event) => {
          micBtn.classList.remove('mic-recording');
          const transcripts = [];
          for (let i = 0; i < event.results[0].length; i++) {
            transcripts.push(event.results[0][i].transcript);
          }

          const bestTranscript = transcripts[0] || '';
          const heardBox = document.getElementById('speech-heard-box');
          const heardText = document.getElementById('speech-heard-text');
          if (heardBox && heardText) {
            heardText.textContent = bestTranscript;
            heardBox.classList.remove('hidden');
          }

          const normTarget = normalizeArabic(step.targetAr);
          const targetTokens = normTarget.split(' ').filter(Boolean);

          // Forgiving check: match if full normalized string matches or >= 50% of key words match
          const isMatch = transcripts.some(t => {
            const normHeard = normalizeArabic(t);
            if (normHeard.includes(normTarget) || normTarget.includes(normHeard)) return true;
            const matchedTokens = targetTokens.filter(tok => normHeard.includes(tok));
            return targetTokens.length > 0 && (matchedTokens.length / targetTokens.length) >= 0.5;
          });

          activeSession.stepAnswered = true;
          if (isMatch) activeSession.correctCount++;

          showStepFeedback(
            isMatch,
            isMatch
              ? 'Klasse ausgesprochen! Deine Aussprache wurde klar erkannt.'
              : 'Fast! Automatische Spracherkennung ist bei Dialekten manchmal streng – hör dir den Satz gerne noch einmal an oder gehe weiter.'
          );
        };

        activeRecognition.onerror = (e) => {
          micBtn.classList.remove('mic-recording');
          statusEl.textContent = e.error === 'not-allowed'
            ? 'Mikrofonzugriff wurde blockiert. Du kannst die Übung einfach überspringen.'
            : 'Nichts erkannt – versuche es gerne noch einmal oder überspringe den Schritt.';
        };

        activeRecognition.onend = () => {
          micBtn.classList.remove('mic-recording');
        };

        activeRecognition.start();
      } catch (err) {
        statusEl.textContent = 'Spracheingabe konnte nicht gestartet werden. Bitte überspringe diesen Schritt.';
      }
    }

    function skipSpeakingStep() {
      if (activeRecognition) {
        try { activeRecognition.abort(); } catch (e) {}
      }
      // Do not penalize quizTotal when skipped
      if (activeSession && activeSession.quizTotal > 0) {
        activeSession.quizTotal = Math.max(1, activeSession.quizTotal - 1);
      }
      advanceStep(false);
    }

    function showStepFeedback(isCorrect, messageHtml) {
      const fb = document.getElementById('step-feedback');
      if (!fb) return;
      fb.classList.remove('hidden');
      fb.className = `mt-5 p-4 rounded-2xl border ${
        isCorrect
          ? 'bg-zellige-50 border-zellige-200 text-zellige-800'
          : 'bg-terracotta-50 border-terracotta-200 text-terracotta-800'
      } animate-step`;

      fb.innerHTML = `
        <div class="flex items-start gap-3 mb-3">
          <span class="text-xl">${isCorrect ? '🎉' : '💡'}</span>
          <div class="text-sm leading-relaxed">
            <p class="font-bold mb-0.5">${isCorrect ? 'Richtig!' : 'Hinweis:'}</p>
            <div>${messageHtml}</div>
          </div>
        </div>
        <button type="button" onclick="advanceStep(false)"
          class="w-full py-3 rounded-xl font-bold text-sm text-white transition-colors cursor-pointer ${
            isCorrect ? 'bg-zellige-600 hover:bg-zellige-700' : 'bg-terracotta-600 hover:bg-terracotta-700'
          }">
          Weiter →
        </button>
      `;
    }

    function advanceStep() {
      activeSession.currentIndex++;
      activeSession.stepAnswered = false;
      activeSession.builderSelection = [];
      activeSession.shuffledWords = null;
      renderSessionStep();
    }

    /**
     * ============================================================================
     * 8. SESSION COMPLETION SCREEN
     * ============================================================================
     */
    function renderSessionComplete() {
      const main = document.getElementById('app-main');
      const s = activeSession;
      const scorePct = s.quizTotal > 0 ? Math.round((s.correctCount / s.quizTotal) * 100) : 100;

      // Save progress
      let earnedXp = 25;
      let passedQuiz = true;

      if (s.mode === 'lesson') {
        if (!appState.completedLessons.includes(s.lessonId)) {
          appState.completedLessons.push(s.lessonId);
          earnedXp = 40;
        }
        s.phraseIds.forEach(pid => {
          if (!appState.masteredPhrases.includes(pid)) {
            appState.masteredPhrases.push(pid);
          }
        });
      } else if (s.mode === 'daily') {
        appState.dailyCompletedDate = getTodayISO();
        earnedXp = 50;
        s.phraseIds.forEach(pid => {
          if (!appState.masteredPhrases.includes(pid)) {
            appState.masteredPhrases.push(pid);
          }
        });
      } else if (s.mode === 'quiz') {
        passedQuiz = scorePct >= 70;
        if (passedQuiz && !appState.completedQuizzes.includes(s.chapterId)) {
          appState.completedQuizzes.push(s.chapterId);
          earnedXp = 80;
        } else {
          earnedXp = 20;
        }
      }

      recordDailyActivity(earnedXp);

      main.innerHTML = `
        <div class="max-w-lg mx-auto bg-white rounded-3xl border border-sand-200 shadow-md p-8 text-center animate-step">
          <div class="w-20 h-20 rounded-3xl ${passedQuiz ? 'bg-saffron-100 text-saffron-600' : 'bg-terracotta-100 text-terracotta-600'} flex items-center justify-center text-4xl mx-auto mb-5">
            ${s.mode === 'quiz' ? (passedQuiz ? '🏆' : '💪') : '🎉'}
          </div>

          <h2 class="font-display text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2">
            ${
              s.mode === 'quiz'
                ? (passedQuiz ? 'Kapitel-Test bestanden!' : 'Guter Versuch – gleich nochmal?')
                : 'B-se77a! Einheit abgeschlossen!'
            }
          </h2>
          <p class="text-sm text-slate-500 mb-6">
            ${s.title}
          </p>

          <div class="grid grid-cols-3 gap-3 bg-sand-50 border border-sand-200 rounded-2xl p-4 mb-6">
            <div>
              <p class="text-xs text-slate-500">Trefferquote</p>
              <p class="font-display text-xl font-extrabold text-zellige-700">${scorePct}%</p>
            </div>
            <div>
              <p class="text-xs text-slate-500">Verdiente XP</p>
              <p class="font-display text-xl font-extrabold text-saffron-600">+${earnedXp}</p>
            </div>
            <div>
              <p class="text-xs text-slate-500">Tages-Streak</p>
              <p class="font-display text-xl font-extrabold text-terracotta-600">🔥 ${appState.streak}</p>
            </div>
          </div>

          <div class="space-y-3">
            ${
              s.mode === 'quiz' && !passedQuiz
                ? `<button onclick="startChapterQuiz('${s.chapterId}')" class="w-full py-3.5 rounded-2xl bg-terracotta-600 hover:bg-terracotta-700 text-white font-bold cursor-pointer">Test noch einmal starten</button>`
                : ''
            }
            ${
              s.chapterId
                ? `<button onclick="openSummaryModal('${s.chapterId}')" class="w-full py-3 rounded-2xl bg-sand-100 hover:bg-sand-200 text-slate-800 font-semibold text-sm cursor-pointer">📋 Kapitel-Spickzettel ansehen</button>`
                : ''
            }
            <button onclick="goHome()"
              class="w-full py-3.5 rounded-2xl bg-zellige-600 hover:bg-zellige-700 text-white font-bold shadow-xs cursor-pointer">
              Zurück zur Übersicht
            </button>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 9. MODALS: KAPITEL-ZUSAMMENFASSUNG (SPICKZETTEL) & KAPITEL ERWEITERN
     * ============================================================================
     */
    function openModal(innerHtml) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = innerHtml;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    // Close modal when clicking backdrop
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function openSummaryModal(chapterId) {
      const chapter = getAllChapters().find(c => c.id === chapterId);
      if (!chapter) return;

      const allPhrases = chapter.lessons.flatMap(l => l.phrases);
      const tips = (chapter.summary && chapter.summary.grammarTips) || [];

      openModal(`
        <div class="flex items-start justify-between gap-4 mb-5">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-terracotta-600">Kapitel ${chapter.number} • Spickzettel</span>
            <h2 class="font-display text-2xl font-extrabold text-slate-800 mt-0.5">${chapter.title}</h2>
          </div>
          <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-sand-100 hover:bg-sand-200 flex items-center justify-center font-bold text-slate-600 cursor-pointer">✕</button>
        </div>

        <!-- Grammar & Culture Tips -->
        ${tips.length > 0 ? `
          <div class="mb-6">
            <h3 class="font-display text-sm font-bold uppercase tracking-wider text-zellige-700 mb-3">💡 Grammatik &amp; Kultur-Tipps</h3>
            <div class="space-y-3">
              ${tips.map(t => `
                <div class="bg-saffron-50/80 border border-saffron-200 rounded-2xl p-4">
                  <p class="font-bold text-sm text-slate-800 mb-1">${t.title}</p>
                  <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">${t.text}</p>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Vocabulary List -->
        <div>
          <h3 class="font-display text-sm font-bold uppercase tracking-wider text-zellige-700 mb-3">📚 Wichtigste Ausdrücke (${allPhrases.length})</h3>
          <div class="divide-y divide-sand-200 border border-sand-200 rounded-2xl overflow-hidden">
            ${allPhrases.map(p => `
              <div class="p-3.5 sm:p-4 bg-white hover:bg-sand-50/70 flex items-center justify-between gap-3">
                <div class="flex-1">
                  <p class="arabic-text text-lg sm:text-xl font-bold text-slate-900">${p.ar}</p>
                  ${appState.showTransliteration ? `<p class="text-xs text-terracotta-600 font-semibold">${p.tr}</p>` : ''}
                  <p class="text-sm text-slate-700 mt-0.5">${p.de}</p>
                </div>
                <button type="button" onclick="speakDarija('${escapeQuotes(p.ar)}', 0.9)"
                  class="w-10 h-10 rounded-xl bg-zellige-50 hover:bg-zellige-100 text-zellige-700 flex items-center justify-center shrink-0 cursor-pointer" title="Anhören">
                  🔊
                </button>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="mt-6 flex flex-wrap items-center justify-end gap-3">
          <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-sand-100 hover:bg-sand-200 text-slate-700 text-sm font-semibold cursor-pointer">Schließen</button>
          <button onclick="closeModal(); startChapterQuiz('${chapter.id}')" class="px-5 py-2.5 rounded-xl bg-terracotta-600 hover:bg-terracotta-700 text-white text-sm font-bold cursor-pointer">🏆 Abschluss-Test starten</button>
        </div>
      `);
    }

    function openExtendModal() {
      const sampleTemplate = JSON.stringify([
        {
          id: "kapitel-6",
          number: getAllChapters().length + 1,
          title: "Im Café & Restaurant",
          subtitle: "Kaffee, Tajine & Couscous bestellen und die Rechnung verlangen",
          icon: "☕",
          lessons: [
            {
              id: "k6-l1",
              title: "Kaffee & Getränke bestellen",
              duration: "5 Min.",
              phrases: [
                {
                  id: "p6_1",
                  ar: "عافاك بغيت قهوة نص نص",
                  tr: "3afak bghit 9ehwa ness-ness",
                  de: "Ich möchte bitte einen Milchkaffee (halb Kaffee, halb Milch)",
                  note: "'9ehwa ness-ness' ist der absolute Klassiker in marokkanischen Cafés!"
                }
              ],
              exercises: [
                {
                  type: "choice",
                  prompt: "Wie bestellst du einen typischen marokkanischen Milchkaffee?",
                  options: [
                    { ar: "بغيت قهوة نص نص", tr: "Bghit 9ehwa ness-ness", correct: true },
                    { ar: "بغيت كاس د أتاي", tr: "Bghit kas d-atay", correct: false }
                  ],
                  explanation: "'Ness-ness' bedeutet 'halb-halb' (halb Espresso, halb heiße Milch)."
                }
              ]
            }
          ],
          summary: {
            grammarTips: [
              {
                title: "Kaffee-Kultur in Marokko",
                text: "<strong>9ehwa ka7la</strong> = schwarzer Kaffee, <strong>9ehwa ness-ness</strong> = Milchkaffee, <strong>9ehwa b-l7lib</strong> = Kaffee mit viel Milch."
              }
            ]
          },
          chapterQuiz: [
            {
              type: "choice",
              prompt: "Was ist eine „9ehwa ness-ness“?",
              options: [
                { ar: "قهوة نص نص", tr: "Milchkaffee (halb Kaffee, halb Milch)", correct: true },
                { ar: "قهوة نص نص", tr: "Minztee ohne Zucker", correct: false }
              ],
              explanation: "'Ness-ness' = halb-halb."
            }
          ]
        }
      ], null, 2);

      openModal(`
        <div class="flex items-start justify-between gap-4 mb-4">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-zellige-700">Erweitern &amp; Datensicherung</span>
            <h2 class="font-display text-2xl font-extrabold text-slate-800 mt-0.5">Neue Kapitel hinzufügen</h2>
          </div>
          <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-sand-100 hover:bg-sand-200 flex items-center justify-center font-bold text-slate-600 cursor-pointer">✕</button>
        </div>

        <p class="text-sm text-slate-600 leading-relaxed mb-4">
          Deine App ist modular aufgebaut: Wenn du mit Kapitel 5 fertig bist, kannst du mir einfach sagen, welche Themen du als Nächstes lernen möchtest. Ich erstelle dir dann neue Kapitel im passenden Format, die du hier mit einem Klick einfügst – <strong>dein bisheriger Lernstand bleibt dabei komplett erhalten!</strong>
        </p>

        <!-- Import JSON Area -->
        <div class="mb-5">
          <div class="flex items-center justify-between mb-1.5">
            <label for="chapter-json-input" class="text-xs font-bold uppercase tracking-wider text-slate-700">
              Kapitel-JSON einfügen:
            </label>
            <button type="button" onclick="loadSampleIntoTextarea()"
              class="text-xs font-semibold text-zellige-700 hover:underline cursor-pointer">
              Beispiel-Kapitel 6 zum Testen einfügen
            </button>
          </div>
          <textarea id="chapter-json-input" rows="6"
            placeholder='Füge hier das JSON für neue Kapitel ein (z. B. [ { "id": "kapitel-6", ... } ])'
            class="w-full rounded-2xl border border-sand-300 bg-sand-50 p-3.5 text-xs font-mono text-slate-800 focus:outline-none focus:border-zellige-600"></textarea>

          <div class="flex flex-wrap items-center gap-2 mt-3">
            <button type="button" onclick="importChaptersFromInput()"
              class="px-5 py-2.5 rounded-xl bg-zellige-600 hover:bg-zellige-700 text-white text-sm font-bold cursor-pointer">
              ➕ Kapitel jetzt hinzufügen
            </button>
            <button type="button" onclick="copyTemplateJson()"
              class="px-4 py-2.5 rounded-xl bg-sand-100 hover:bg-sand-200 text-slate-700 text-xs sm:text-sm font-semibold cursor-pointer">
              📋 JSON-Struktur kopieren
            </button>
          </div>
        </div>

        <!-- Backup & Restore Section -->
        <div class="pt-5 border-t border-sand-200">
          <h3 class="font-display text-sm font-bold text-slate-800 mb-2">💾 Lernstand sichern &amp; wiederherstellen</h3>
          <p class="text-xs text-slate-500 mb-3">
            Sichere deinen Fortschritt inklusive eigener Kapitel als Text-Code, falls du das Gerät wechselst.
          </p>
          <div class="flex flex-wrap gap-2">
            <button type="button" onclick="exportProgressBackup()"
              class="px-4 py-2 rounded-xl bg-saffron-50 hover:bg-saffron-100 text-saffron-600 border border-saffron-200 text-xs font-bold cursor-pointer">
              📤 Fortschritt kopieren
            </button>
            ${
              (appState.customChapters && appState.customChapters.length > 0)
                ? `<button type="button" onclick="removeCustomChapters()" class="px-4 py-2 rounded-xl bg-terracotta-50 hover:bg-terracotta-100 text-terracotta-700 text-xs font-semibold cursor-pointer">🗑️ Importierte Zusatz-Kapitel entfernen (${appState.customChapters.length})</button>`
                : ''
            }
          </div>
        </div>

        <textarea id="hidden-template-store" class="hidden">${sampleTemplate}</textarea>
      `);
    }

    function loadSampleIntoTextarea() {
      const tpl = document.getElementById('hidden-template-store').value;
      document.getElementById('chapter-json-input').value = tpl;
    }

    function copyTemplateJson() {
      const tpl = document.getElementById('hidden-template-store').value;
      copyTextToClipboard(tpl, 'Kapitel-Vorlage in die Zwischenablage kopiert!');
    }

    function importChaptersFromInput() {
      const raw = document.getElementById('chapter-json-input').value.trim();
      if (!raw) {
        showToast('Bitte füge zuerst einen JSON-Code für neue Kapitel ein.', 'warning');
        return;
      }

      try {
        let parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          parsed = [parsed];
        }

        // Validate minimal schema
        const validChapters = parsed.filter(ch => ch && ch.id && ch.title && Array.isArray(ch.lessons));
        if (validChapters.length === 0) {
          showToast('Ungültiges Format: Ein Kapitel benötigt mindestens id, title und lessons.', 'warning');
          return;
        }

        const existingIds = new Set(getAllChapters().map(c => c.id));
        let addedCount = 0;

        validChapters.forEach(ch => {
          if (!existingIds.has(ch.id)) {
            ch.number = getAllChapters().length + 1;
            appState.customChapters.push(ch);
            existingIds.add(ch.id);
            addedCount++;
          }
        });

        if (addedCount === 0) {
          showToast('Diese Kapitel-ID existiert bereits in deiner App.', 'info');
          return;
        }

        saveState();
        closeModal();
        renderDashboard();
        showToast(`${addedCount} neue(s) Kapitel erfolgreich hinzugefügt!`, 'success');
      } catch (err) {
        showToast('Fehler beim Lesen des JSON-Textes. Bitte prüfe die Klammern und Anführungszeichen.', 'warning');
      }
    }

    function removeCustomChapters() {
      appState.customChapters = [];
      saveState();
      closeModal();
      renderDashboard();
      showToast('Importierte Zusatz-Kapitel wurden entfernt.', 'info');
    }

    function exportProgressBackup() {
      const backupJson = JSON.stringify(appState);
      copyTextToClipboard(backupJson, 'Dein kompletter Lernstand wurde in die Zwischenablage kopiert!');
    }

    function escapeQuotes(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    /**
     * ============================================================================
     * 10. INITIALIZATION
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      initVoices();
      updateHeaderStats();
      updateTranslitButton();
      renderDashboard();
    });
  </script>
</body>
</html>
